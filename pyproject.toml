[project]
name = "continuum-health"
version = "0.1.0"
description = "Continuum Health: longitudinal records for patients with sickle cell disease (pilot, Kenya)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "django-environ>=0.12",
    "django-htmx>=1.23",
    "django-csp>=4.0",
    "psycopg[binary]>=3.2",
    "whitenoise>=6.9",
    "argon2-cffi>=23.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.11",
    "pytest-cov>=6.0",
    "factory-boy>=3.3",
    "ruff>=0.11",
    "black>=25.1",
    "mypy>=1.15",
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "djangorestframework-stubs[compatible-mypy]>=3.16",
    "bandit>=1.8",
    "pip-audit>=2.9",
    "pre-commit>=4.2",
]

[tool.uv]
package = false

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "--reuse-db --strict-markers -ra"
testpaths = ["apps"]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["apps"]
branch = true
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80

# --- ruff / black -----------------------------------------------------------
[tool.black]
line-length = 99
target-version = ["py312"]

[tool.ruff]
line-length = 99
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "S", "C4", "SIM", "RUF", "T20", "PT"]
ignore = [
    "E501",    # black owns line length
    "RUF012",  # Django Meta options (constraints, ordering) are class-level lists by design
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]  # asserts and fake passwords are fine in tests
"conftest.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unreachable = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["environ.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# factory_boy's public names (Sequence, post_generation, ...) are re-exported implicitly.
module = ["factory", "factory.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
# Application code is fully strict. Test bodies are not type-checked: factory_boy's
# typing cannot express that `UserFactory()` returns a `User`, so strict checks there
# add noise without catching real bugs. Annotated helpers in tests are still checked.
module = ["apps.*.tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false

[tool.django-stubs]
django_settings_module = "config.settings.test"

# --- bandit -----------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
